<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PersuasiX Settings</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #818cf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { color: var(--accent); font-size: 24px; }
    .card {
      background: var(--card);
      border: 1px solid rgba(129,140,248,0.15);
      border-radius: 12px;
      padding: 20px;
      margin: 16px 0;
    }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid rgba(129,140,248,0.2);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 12px;
    }
    button:hover { opacity: 0.9; }
    .status { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .status.success { color: #22c55e; }
    .status.error { color: #f43f5e; }
  </style>
</head>
<body>
  <h1>PersuasiX Settings</h1>

  <div class="card">
    <label>API Server URL</label>
    <input type="url" id="apiUrl" value="http://localhost:8000" placeholder="http://localhost:8000">
    <div class="status" id="connectionStatus"></div>
  </div>

  <div class="card">
    <label>Default Language</label>
    <select id="defaultLang" style="width:100%;padding:10px;background:var(--bg);border:1px solid rgba(129,140,248,0.2);border-radius:8px;color:var(--text);font-size:14px;">
      <option value="en">English</option>
      <option value="fr">French</option>
      <option value="ar">Arabic</option>
      <option value="es">Spanish</option>
      <option value="de">German</option>
      <option value="zh">Chinese</option>
      <option value="hi">Hindi</option>
    </select>
  </div>

  <div class="card">
    <label>
      <input type="checkbox" id="autoAnalyze"> Auto-analyze pages on load
    </label>
    <label style="margin-top: 8px;">
      <input type="checkbox" id="showBadge" checked> Show risk score badge on icon
    </label>
  </div>

  <button id="saveBtn">Save Settings</button>
  <button id="testBtn" style="background: var(--card); margin-left: 8px;">Test Connection</button>
  <div class="status" id="saveStatus"></div>

  <script>
    const apiUrlInput = document.getElementById('apiUrl');
    const defaultLang = document.getElementById('defaultLang');
    const autoAnalyze = document.getElementById('autoAnalyze');
    const showBadge = document.getElementById('showBadge');
    const saveBtn = document.getElementById('saveBtn');
    const testBtn = document.getElementById('testBtn');
    const saveStatus = document.getElementById('saveStatus');
    const connectionStatus = document.getElementById('connectionStatus');

    // Load settings
    chrome.storage.local.get(['apiUrl', 'language', 'autoAnalyze', 'showBadge'], (data) => {
      if (data.apiUrl) apiUrlInput.value = data.apiUrl;
      if (data.language) defaultLang.value = data.language;
      if (data.autoAnalyze !== undefined) autoAnalyze.checked = data.autoAnalyze;
      if (data.showBadge !== undefined) showBadge.checked = data.showBadge;
    });

    saveBtn.addEventListener('click', () => {
      chrome.storage.local.set({
        apiUrl: apiUrlInput.value,
        language: defaultLang.value,
        autoAnalyze: autoAnalyze.checked,
        showBadge: showBadge.checked,
      }, () => {
        saveStatus.textContent = 'Settings saved!';
        saveStatus.className = 'status success';
        setTimeout(() => { saveStatus.textContent = ''; }, 3000);
      });
    });

    testBtn.addEventListener('click', async () => {
      connectionStatus.textContent = 'Testing...';
      connectionStatus.className = 'status';
      try {
        const r = await fetch(`${apiUrlInput.value}/health`, { signal: AbortSignal.timeout(5000) });
        const data = await r.json();
        connectionStatus.textContent = `Connected! Status: ${data.pipeline_status || 'ready'}`;
        connectionStatus.className = 'status success';
      } catch (e) {
        connectionStatus.textContent = `Connection failed: ${e.message}`;
        connectionStatus.className = 'status error';
      }
    });
  </script>
</body>
</html>
