version: "3.8"

services:
  # FastAPI REST API
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  # Gradio Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python app/app.py
    ports:
      - "7863:7863"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - PYTHONPATH=/app
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7863
    depends_on:
      - api
    restart: unless-stopped

volumes:
  data:
