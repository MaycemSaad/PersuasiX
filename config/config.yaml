# PersuasiX Configuration

project:
  name: "PersuasiX"
  version: "1.0.0"
  seed: 42
  languages: ["en", "fr", "ar"]

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  sample_dir: "data/sample"
  max_seq_length: 512
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

techniques:
  - appeal_to_fear
  - appeal_to_authority
  - bandwagon
  - false_dilemma
  - ad_hominem
  - straw_man
  - red_herring
  - loaded_language
  - whataboutism
  - causal_oversimplification
  - appeal_to_emotion
  - repetition
  - exaggeration
  - doubt
  - slogans
  - name_calling
  - flag_waving
  - thought_terminating_cliche

collection:
  sources:
    - "propaganda_semeval"
    - "news_articles"
    - "social_media"
  min_text_length: 20
  max_text_length: 2048
  rate_limit_seconds: 1.0

enrichment:
  provider: "openai"
  model: "gpt-4o-mini"
  batch_size: 20
  max_retries: 3
  temperature: 0.3
  languages: ["en", "fr", "ar"]

detector:
  model_name: "roberta-base"
  num_labels: 18
  learning_rate: 2.0e-5
  batch_size: 16
  epochs: 10
  warmup_ratio: 0.1
  weight_decay: 0.01
  threshold: 0.5
  dropout: 0.1

explainer:
  model_name: "google/flan-t5-base"
  max_input_length: 512
  max_output_length: 256
  learning_rate: 3.0e-5
  batch_size: 8
  epochs: 8
  beam_size: 4

neutralizer:
  model_name: "google/flan-t5-base"
  max_input_length: 512
  max_output_length: 512
  learning_rate: 3.0e-5
  batch_size: 8
  epochs: 8
  beam_size: 4

scorer:
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  embedding_dim: 384
  similarity_threshold: 0.75

training:
  output_dir: "checkpoints"
  logging_dir: "logs"
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "f1_macro"
  fp16: true
  gradient_accumulation_steps: 2
  dataloader_num_workers: 4
  use_wandb: false
  wandb_project: "persuasix"

demo:
  title: "PersuasiX Studio"
  description: "Detect, explain, and neutralize persuasion techniques in text"
  port: 7860
  share: false
  theme: "soft"
